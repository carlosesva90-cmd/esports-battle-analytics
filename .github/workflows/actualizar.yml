name: Actualizar Esports Battle

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: esports-pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ESOCCER_BATTLE_DB: /tmp/battle.db
      ESOCCER_BATTLE_NO_UPDATE_CHECK: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Recuperar base de datos
        uses: actions/cache@v5
        with:
          path: /tmp/battle.db
          key: battle-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            battle-db-

      - uses: astral-sh/setup-uv@v6

      - name: Sincronizar resultados
        run: uvx --from git+https://github.com/Jhanee01/esoccer-battle-mcp@v1.0.2 esoccer-battle-mcp sync

      - name: Actualizar HTML
        run: python3 actualizar_datos.py /tmp/battle.db index.html

      - name: Preparar pagina
        run: |
          mkdir -p sitio
          cp index.html sitio/index.html

      - uses: actions/configure-pages@v5

      - name: Guardar pagina
        uses: actions/upload-pages-artifact@v4
        with:
          path: sitio

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
